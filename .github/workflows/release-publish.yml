name: Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets for'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  assess-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}

    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Determine whether the tag ships the release pipeline
        id: check
        run: |
          if [ -f .github/workflows/release-publish.yml ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "Tag predates the release pipeline; skipping asset build for this historical marker release."
          fi

  build-source-bundle:
    needs: assess-tag
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

      - name: Prepare source bundle
        run: |
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            -czf dist/nvidia-ai-hub-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvidia-ai-hub-source-release
          path: dist/nvidia-ai-hub-source.tar.gz
          if-no-files-found: error

  build-desktop-assets:
    needs: assess-tag
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nvidia-ai-hub-desktop-windows-release
            build_command: >-
              npx electron-builder --win nsis --publish never -c.artifactName='${productName}-${version}-win-${arch}-setup.${ext}' &&
              npx electron-builder --win portable --publish never -c.artifactName='${productName}-${version}-win-${arch}-portable.${ext}' &&
              npx electron-builder --win zip --publish never -c.artifactName='${productName}-${version}-win-${arch}.${ext}' &&
              npx electron-builder --win msi --publish never -c.artifactName='${productName}-${version}-win-${arch}.${ext}'
          - os: macos-latest
            artifact_name: nvidia-ai-hub-desktop-macos-release
            build_command: npx electron-builder --publish never
          - os: ubuntu-latest
            artifact_name: nvidia-ai-hub-desktop-linux-release
            build_command: npx electron-builder --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop artifacts
        working-directory: frontend
        shell: bash
        run: |
          npm run desktop:prepare
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          // electron-builder reads author.email for the .deb maintainer field
          const pkgPath = path.resolve('package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          if (!pkg.author || typeof pkg.author !== 'object' || !pkg.author.email) {
            const name = (pkg.author && (pkg.author.name || pkg.author)) || 'Pho Tue SoftWare And Technology Solutions Joint Stock Company'
            pkg.author = { name: name, email: 'thanhan92f1@gmail.com' }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
            console.log('packaging: normalized author email')
          }

          // venv absolute symlinks point outside the app bundle and make
          // codesign --verify --strict fail on macOS; copy them in place
          const root = path.resolve('electron/backend-dist')
          if (fs.existsSync(root)) {
            let fixed = 0
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const target = path.join(dir, entry.name)
                if (entry.isSymbolicLink()) {
                  let resolved = null
                  try { resolved = fs.realpathSync(target) } catch {}
                  const inside = resolved !== null && (resolved === root || resolved.startsWith(root + path.sep))
                  if (!inside) {
                    if (resolved && fs.existsSync(resolved) && fs.statSync(resolved).isFile()) {
                      fs.unlinkSync(target)
                      fs.copyFileSync(resolved, target)
                    } else if (resolved && fs.existsSync(resolved) && fs.statSync(resolved).isDirectory()) {
                      fs.unlinkSync(target)
                      fs.cpSync(resolved, target, { recursive: true, dereference: true })
                    } else {
                      fs.unlinkSync(target)
                    }
                    fixed += 1
                  }
                } else if (entry.isDirectory()) {
                  walk(target)
                }
              }
            }
            walk(root)
            console.log('packaging: sanitized external symlinks: ' + fixed)
          }
          NODE
          ${{ matrix.build_command }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            frontend/release/*.exe
            frontend/release/*.msi
            frontend/release/*.zip
            frontend/release/*.dmg
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.tar.gz
            frontend/release/*.blockmap
            frontend/release/latest*.yml
            !frontend/release/*.__uninstaller.exe
          if-no-files-found: error

  publish-release-assets:
    needs:
      - assess-tag
      - build-source-bundle
      - build-desktop-assets
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/release-assets

      - name: Publish release notes and assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: ${{ github.event.release.prerelease || false }}
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/**/*.tar.gz
            dist/release-assets/**/*.exe
            dist/release-assets/**/*.msi
            dist/release-assets/**/*.zip
            dist/release-assets/**/*.dmg
            dist/release-assets/**/*.AppImage
            dist/release-assets/**/*.deb
            dist/release-assets/**/*.blockmap
            dist/release-assets/**/latest*.yml