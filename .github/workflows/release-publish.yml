name: Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  assess-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}

    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Determine whether the tag ships the release pipeline
        id: check
        run: |
          if [ -f .github/workflows/release-publish.yml ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "Tag predates the release pipeline; skipping asset build for this historical marker release."
          fi

  build-source-bundle:
    needs: assess-tag
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

      - name: Prepare source bundle
        run: |
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            -czf dist/nvidia-ai-hub-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-ai-hub-source-release
          path: dist/nvidia-ai-hub-source.tar.gz
          if-no-files-found: error

  build-desktop-assets:
    needs: assess-tag
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nvidia-ai-hub-desktop-windows-release
            build_command: npm run desktop:dist:win
          - os: macos-latest
            artifact_name: nvidia-ai-hub-desktop-macos-release
            build_command: npm run desktop:dist
          - os: ubuntu-latest
            artifact_name: nvidia-ai-hub-desktop-linux-release
            build_command: npm run desktop:dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop artifacts
        working-directory: frontend
        run: ${{ matrix.build_command }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            frontend/release/*.exe
            frontend/release/*.msi
            frontend/release/*.zip
            frontend/release/*.dmg
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.tar.gz
            frontend/release/latest*.yml
          if-no-files-found: error

  publish-release-assets:
    needs:
      - assess-tag
      - build-source-bundle
      - build-desktop-assets
    if: ${{ needs.assess-tag.outputs.buildable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets

      - name: Publish release notes and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: ${{ github.event.release.prerelease || false }}
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/**/*.tar.gz
            dist/release-assets/**/*.exe
            dist/release-assets/**/*.msi
            dist/release-assets/**/*.zip
            dist/release-assets/**/*.dmg
            dist/release-assets/**/*.AppImage
            dist/release-assets/**/*.deb
            dist/release-assets/**/latest*.yml